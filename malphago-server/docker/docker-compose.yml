services:
  db:
    image: postgres:16-alpine
    container_name: malphago-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-malphago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-malphago}
      POSTGRES_DB: ${POSTGRES_DB:-malphago}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malphago"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: malphago-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-malphago}:${POSTGRES_PASSWORD:-malphago}@db:5432/${POSTGRES_DB:-malphago}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../app:/app/app
    restart: unless-stopped

volumes:
  pgdata:
