services:
  db:
    image: postgres:16-alpine
    container_name: malphago-db
    environment:
      POSTGRES_USER: malphago
      POSTGRES_PASSWORD: malphago
      POSTGRES_DB: malphago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malphago"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: malphago-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://malphago:malphago@db:5432/malphago
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../app:/app/app

volumes:
  pgdata:
